<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de biorritmo</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="root">
    <div class="topbar">
      <label class="theme-picker">
        Tema
        <select id="theme-select">
          <option value="system">Sistema</option>
          <option value="light">Claro</option>
          <option value="dark">Oscuro</option>
        </select>
      </label>
    </div>

    <section id="biorritmo">
      <h1>Calculadora de biorritmo</h1>
      <p class="subtitle">
        Ingresa tu fecha de nacimiento para graficar tus ciclos físico, emocional e intelectual, junto con los
        aspectos complementarios: espiritual, conciencia, intuición y estética.
      </p>

      <div class="controls">
        <label>
          Fecha de nacimiento
          <input type="date" id="birth-date">
        </label>
        <label>
          Fecha a analizar
          <input type="date" id="selected-date">
        </label>
        <div class="date-nav">
          <button type="button" id="prev-day" aria-label="Día anterior">←</button>
          <button type="button" id="today-btn">Hoy</button>
          <button type="button" id="next-day" aria-label="Día siguiente">→</button>
        </div>
      </div>

      <div id="results"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
