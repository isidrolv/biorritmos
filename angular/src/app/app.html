<section id="biorritmo" [attr.data-theme]="theme()">
  <div class="theme-picker">
    <label for="theme-select">Tema</label>
    <select id="theme-select" [value]="theme()" (change)="setTheme($event)">
      @for (option of themes; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <app-biorhythm-header />

  <app-biorhythm-input-form
    [today]="today"
    [birthDate]="birthDate()"
    [selectedDate]="selectedDate()"
    [isToday]="isToday()"
    (birthDateChange)="birthDate.set($event)"
    (selectedDateChange)="selectedDate.set($event)"
    (previousDay)="shiftSelectedDate(-1)"
    (goToToday)="selectedDate.set(today)"
    (nextDay)="shiftSelectedDate(1)"
  />

  @if (series(); as currentSeries) {
    <app-biorhythm-histogram
      [series]="currentSeries"
      [isToday]="isToday()"
      [selectedDate]="selectedDateValue()"
      [visible]="visible()"
      (aspectToggle)="toggleAspect($event)"
    />
  } @else {
    <p class="empty-state">Ingresa tu fecha de nacimiento para ver tu gráfico de biorritmo.</p>
  }
</section>
